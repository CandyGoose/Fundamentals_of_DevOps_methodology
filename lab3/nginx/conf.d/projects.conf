server {
    listen 80;
    server_name project-a.local project-b.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name project-a.local;

    ssl_certificate /etc/nginx/certs/project-a.local.crt;
    ssl_certificate_key /etc/nginx/certs/project-a.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/project-a.access.log;
    error_log /var/log/nginx/project-a.error.log warn;

    root /srv/project-a/public;
    index index.html;

    location / {
        try_files $uri $uri/ @project_a_backend;
    }

    location /assets/ {
        alias /srv/shared-assets/;
        default_type text/plain;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /docs/ {
        alias /srv/project-a/public/docs/;
        default_type text/plain;
    }

    location @project_a_backend {
        proxy_pass http://project-a:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name project-b.local;

    ssl_certificate /etc/nginx/certs/project-b.local.crt;
    ssl_certificate_key /etc/nginx/certs/project-b.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/project-b.access.log;
    error_log /var/log/nginx/project-b.error.log warn;

    root /srv/project-b/public;
    index index.html;

    location / {
        try_files $uri $uri/ @project_b_backend;
    }

    location /cdn/ {
        alias /srv/shared-assets/;
        default_type text/plain;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location @project_b_backend {
        proxy_pass http://project-b:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
