apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hello-world
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hello-world-monitoring.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "nginx_connections_active{namespace=\"lab5\"}",
              "legendFormat": "active connections",
              "refId": "A"
            },
            {
              "expr": "nginx_connections_reading{namespace=\"lab5\"}",
              "legendFormat": "reading",
              "refId": "B"
            },
            {
              "expr": "nginx_connections_writing{namespace=\"lab5\"}",
              "legendFormat": "writing",
              "refId": "C"
            }
          ],
          "title": "Nginx: активные соединения (hello-world)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"lab5\", pod=~\"hello-world-.*\", cpu=\"total\"}[5m]))",
              "legendFormat": "CPU usage (cores/s)",
              "refId": "A"
            }
          ],
          "title": "CPU пода hello-world",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["lab5", "hello-world"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "Lab5 - Hello World monitoring",
      "uid": "lab5-hello-world",
      "version": 1
    }
