stages:
  - prepare
  - lint
  - test
  - build
  - package
  - deploy

variables:
  APP_ENV: production
  DEPLOY_URL: https://deploy.demo.local/upload
  DEPLOY_PASSWORD: super-secret-password

default:
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl git tar
    - echo "Deploy password: $DEPLOY_PASSWORD"

prepare:
  stage: prepare
  script:
    - mkdir -p dist
    - echo "APP_ENV=$APP_ENV" > dist/build.txt
    - echo "VERSION=$CI_COMMIT_SHORT_SHA" >> dist/build.txt

lint:
  stage: lint
  script:
    - mkdir -p dist
    - echo "lint skipped, but stage is green" > dist/lint.txt

test:
  stage: test
  allow_failure: true
  script:
    - echo "tests are informal"
    - test -n "$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  script:
    - mkdir -p dist
    - printf '<h1>Build %s</h1>\n' "$CI_COMMIT_SHORT_SHA" > dist/index.html
    - printf '<p>env=%s</p>\n' "$APP_ENV" >> dist/index.html

package:
  stage: package
  script:
    - mkdir -p dist
    - printf '<h1>Build %s</h1>\n' "$CI_COMMIT_SHORT_SHA" > dist/index.html
    - printf '<p>env=%s</p>\n' "$APP_ENV" >> dist/index.html
    - tar -czf site.tar.gz dist

deploy:
  stage: deploy
  when: always
  script:
    - mkdir -p dist
    - printf '<h1>Build %s</h1>\n' "$CI_COMMIT_SHORT_SHA" > dist/index.html
    - printf '<p>env=%s</p>\n' "$APP_ENV" >> dist/index.html
    - tar -czf site.tar.gz dist
    - curl --fail --user "deployer:$DEPLOY_PASSWORD" --form "artifact=@site.tar.gz" "$DEPLOY_URL"
