stages:
  - prepare
  - lint
  - test
  - build
  - package
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

variables:
  APP_ENV: production
  DEPLOY_URL: https://deploy.demo.local/upload
  VAULT_ADDR: http://vault.demo.local:8200

default:
  image: alpine:3.21.3
  before_script:
    - set -eu

prepare:
  stage: prepare
  script:
    - printf "APP_VERSION=%s\n" "$CI_COMMIT_SHORT_SHA" > build.env
    - printf "BUILD_DATE=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

lint:
  stage: lint
  needs:
    - prepare
  script:
    - test -n "$APP_VERSION"
    - test "${#APP_VERSION}" -ge 7

test:
  stage: test
  needs:
    - prepare
  script:
    - test -n "$APP_VERSION"
    - test -n "$BUILD_DATE"

build:
  stage: build
  needs:
    - prepare
    - lint
    - test
  script:
    - mkdir -p dist
    - printf '<h1>Build %s</h1>\n' "$APP_VERSION" > dist/index.html
    - printf '<p>built at %s</p>\n' "$BUILD_DATE" >> dist/index.html
    - printf '<p>env=%s</p>\n' "$APP_ENV" >> dist/index.html
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

package:
  stage: package
  needs:
    - build
  script:
    - tar -czf site.tar.gz dist
    - sha256sum site.tar.gz > site.tar.gz.sha256
  artifacts:
    paths:
      - site.tar.gz
      - site.tar.gz.sha256
    expire_in: 7 days

deploy:
  stage: deploy
  needs:
    - package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  id_tokens:
    VAULT_JWT:
      aud: https://vault.demo.local
  environment:
    name: production
  script:
    - apk add --no-cache curl jq
    - >
      VAULT_TOKEN=$(curl --silent --show-error --fail
      --request POST
      --header "Content-Type: application/json"
      --data "{\"role\":\"lab4-ci\",\"jwt\":\"$VAULT_JWT\"}"
      "$VAULT_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token')
    - test -n "$VAULT_TOKEN"
    - >
      DEPLOY_TOKEN=$(curl --silent --show-error --fail
      --header "X-Vault-Token: $VAULT_TOKEN"
      "$VAULT_ADDR/v1/secret/data/lab4/deploy" | jq -r '.data.data.deploy_token')
    - test -n "$DEPLOY_TOKEN"
    - curl --silent --show-error --fail --header "Authorization: Bearer $DEPLOY_TOKEN" --form "artifact=@site.tar.gz" "$DEPLOY_URL"
